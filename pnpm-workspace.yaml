packages:
  - "apps/*"
  - "packages/*"

# pnpm 12 supply-chain : pas de délai minimum (sinon Docker refuse des paquets < 24h).
minimumReleaseAge: 0

allowBuilds:
  "@parcel/watcher": true
  "@prisma/engines": true
  argon2: true
  esbuild: true
  # Accélérateur natif optionnel de msgpackr (via BullMQ) : repli JavaScript, aucun script tiers exécuté.
  msgpackr-extract: false
  prisma: true
  unrs-resolver: true
