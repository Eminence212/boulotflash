    <header class="topbar">

      <h1 class="title">Créer une mission</h1>
      <span style="width:44px"></span>
    </header>
    <div class="content">
      <div class="field"><label for="titre">Titre</label><input id="titre" value="Service soirée — plonge" /></div>
      <div class="field"><label for="cat8">Catégorie</label>
        <select id="cat8"><option selected>Service, plonge et cuisine</option><option>Vente</option></select>
      </div>
      <div class="field"><label for="montant">Montant (USD)</label><input id="montant" inputmode="decimal" value="15" /></div>
      <div class="field"><label for="places">Places</label><input id="places" type="number" value="2" min="1" /></div>
      <div class="field"><label for="debut">Début</label><input id="debut" type="datetime-local" /></div>
      <div class="field"><label for="commune8">Commune</label><select id="commune8"><option selected>Gombe</option></select></div>
      <div class="field"><label for="repere">Repère public</label><input id="repere" value="Près du marché central" /></div>
      <div class="field"><label for="adresse">Adresse privée (après acceptation)</label><input id="adresse" value="10 avenue de test, Gombe" /></div>
      <div class="field"><label for="desc">Description</label><textarea id="desc">Service et plonge pour soirée restaurant.</textarea></div>
      <p class="footnote">La publication consomme un droit gratuit tant que les services sont gratuits.</p>
    </div>
    <div class="bottom-bar">
      <button type="button" class="btn btn-secondary">Brouillon</button>
      <button type="button" class="btn btn-primary">Publier</button>
    </div>
